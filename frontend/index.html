<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAW Agent API — Interactive Frontend</title>
  <style>
    /* ------------------------------------------------------------------ */
    /* Reset & base                                                         */
    /* ------------------------------------------------------------------ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1c1f2b;
      --border:    #2e3349;
      --accent:    #5c73f2;
      --accent-h:  #7b8fff;
      --success:   #3ecf8e;
      --danger:    #f56565;
      --text:      #e2e8f0;
      --muted:     #8892a4;
      --radius:    12px;
      --shadow:    0 4px 24px rgba(0,0,0,.45);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ------------------------------------------------------------------ */
    /* Header                                                               */
    /* ------------------------------------------------------------------ */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header .logo {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: grid; place-items: center;
      font-size: 1.2rem;
    }

    header h1 { font-size: 1.25rem; font-weight: 600; }
    header p  { font-size: .8rem; color: var(--muted); margin-top: .1rem; }

    header .spacer { flex: 1; }

    .badge {
      background: rgba(92,115,242,.18);
      color: var(--accent-h);
      border: 1px solid rgba(92,115,242,.4);
      border-radius: 20px;
      padding: .25rem .75rem;
      font-size: .75rem;
    }

    /* ------------------------------------------------------------------ */
    /* Main layout                                                          */
    /* ------------------------------------------------------------------ */
    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* ------------------------------------------------------------------ */
    /* Cards                                                                */
    /* ------------------------------------------------------------------ */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      color: var(--text);
    }

    /* ------------------------------------------------------------------ */
    /* Mode tabs                                                            */
    /* ------------------------------------------------------------------ */
    .tabs {
      display: flex;
      gap: .5rem;
      margin-bottom: 1.25rem;
    }

    .tab {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: .45rem 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: .875rem;
      transition: all .15s;
    }

    .tab:hover { border-color: var(--accent); color: var(--text); }

    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    /* ------------------------------------------------------------------ */
    /* Drop zone                                                            */
    /* ------------------------------------------------------------------ */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      position: relative;
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(92,115,242,.06);
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .drop-icon { font-size: 2.5rem; margin-bottom: .75rem; }

    .drop-zone p  { color: var(--muted); font-size: .9rem; }
    .drop-zone b  { color: var(--text); }

    .file-list {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
    }

    .file-chip {
      background: rgba(92,115,242,.12);
      border: 1px solid rgba(92,115,242,.3);
      color: var(--accent-h);
      border-radius: 6px;
      padding: .3rem .75rem;
      font-size: .8rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .file-chip button {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: .85rem;
      line-height: 1;
    }
    .file-chip button:hover { color: var(--danger); }

    /* ------------------------------------------------------------------ */
    /* API Key input                                                        */
    /* ------------------------------------------------------------------ */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: .4rem;
      margin-bottom: 1rem;
    }

    .field-group label {
      font-size: .8rem;
      color: var(--muted);
      font-weight: 500;
    }

    .field-group input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: .55rem .9rem;
      font-size: .875rem;
      outline: none;
      transition: border-color .15s;
    }

    .field-group input:focus { border-color: var(--accent); }

    /* ------------------------------------------------------------------ */
    /* Buttons                                                              */
    /* ------------------------------------------------------------------ */
    .btn {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: .9rem;
      font-weight: 600;
      padding: .65rem 1.5rem;
      transition: background .15s, transform .1s;
    }

    .btn:hover   { background: var(--accent-h); }
    .btn:active  { transform: scale(.97); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      font-size: .85rem;
      padding: .5rem 1rem;
      transition: border-color .15s, color .15s;
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent-h); }

    /* ------------------------------------------------------------------ */
    /* Progress                                                             */
    /* ------------------------------------------------------------------ */
    .progress-bar-wrap {
      background: var(--bg);
      border-radius: 100px;
      height: 6px;
      overflow: hidden;
      margin-top: .75rem;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 100px;
      transition: width .3s ease;
    }

    .status-text {
      font-size: .8rem;
      color: var(--muted);
      margin-top: .4rem;
    }

    /* ------------------------------------------------------------------ */
    /* Results                                                              */
    /* ------------------------------------------------------------------ */
    #results-section { display: none; }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }

    .result-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .result-card.error { border-color: var(--danger); }

    .result-header {
      padding: .75rem 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .result-header .filename {
      font-size: .85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .status-badge {
      font-size: .7rem;
      font-weight: 600;
      padding: .2rem .6rem;
      border-radius: 20px;
    }

    .status-badge.ok      { background: rgba(62,207,142,.15); color: var(--success); }
    .status-badge.err     { background: rgba(245,101,101,.15); color: var(--danger);  }

    .result-img-wrap {
      position: relative;
      background: #000;
      line-height: 0;
    }

    .result-img-wrap img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      display: block;
    }

    .result-body { padding: .9rem 1rem; }

    .adj-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .8rem;
    }

    .adj-table th {
      text-align: left;
      color: var(--muted);
      font-weight: 500;
      padding: .25rem 0;
      border-bottom: 1px solid var(--border);
    }

    .adj-table td {
      padding: .3rem 0;
      color: var(--text);
    }

    .adj-bar-wrap {
      background: var(--surface);
      border-radius: 100px;
      height: 4px;
      width: 100px;
      display: inline-block;
      vertical-align: middle;
      margin-left: .5rem;
    }

    .adj-bar {
      height: 100%;
      border-radius: 100px;
      background: var(--accent);
    }

    .download-row {
      margin-top: .75rem;
      display: flex;
      gap: .5rem;
    }

    .error-msg {
      color: var(--danger);
      font-size: .85rem;
      padding: .75rem 1rem;
    }

    /* ------------------------------------------------------------------ */
    /* Health indicator                                                     */
    /* ------------------------------------------------------------------ */
    .health-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: .4rem;
      background: var(--muted);
      animation: pulse-muted 2s infinite;
    }
    .health-dot.online  { background: var(--success); animation: pulse-green 2s infinite; }
    .health-dot.offline { background: var(--danger); animation: none; }

    @keyframes pulse-green  { 0%,100%{ box-shadow:0 0 0 0 rgba(62,207,142,.6); } 50%{ box-shadow:0 0 0 5px rgba(62,207,142,0); } }
    @keyframes pulse-muted  { 0%,100%{ opacity:1; } 50%{ opacity:.4; } }

    /* ------------------------------------------------------------------ */
    /* Misc                                                                 */
    /* ------------------------------------------------------------------ */
    .row { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
    .spacer { flex: 1; }

    footer {
      text-align: center;
      padding: 1.25rem;
      font-size: .75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    @media (max-width: 600px) {
      main { padding: 1rem; }
      .result-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ===================================================================== -->
<!-- Header                                                                  -->
<!-- ===================================================================== -->
<header>
  <div class="logo">📷</div>
  <div>
    <h1>RAW Agent API</h1>
    <p>LLM-guided Sony ARW processor</p>
  </div>
  <div class="spacer"></div>
  <span id="health-badge" class="badge" style="display:flex;align-items:center">
    <span class="health-dot" id="health-dot"></span>
    <span id="health-text">checking…</span>
  </span>
</header>

<!-- ===================================================================== -->
<!-- Main                                                                    -->
<!-- ===================================================================== -->
<main>

  <!-- ------------------------------------------------------------------- -->
  <!-- Upload card                                                           -->
  <!-- ------------------------------------------------------------------- -->
  <div class="card">
    <h2>Upload &amp; Process</h2>

    <!-- Mode tabs -->
    <div class="tabs">
      <button class="tab active" id="tab-single" onclick="setMode('single')">Single File</button>
      <button class="tab"        id="tab-batch"  onclick="setMode('batch')">Batch</button>
    </div>

    <!-- Drop zone -->
    <div class="drop-zone" id="drop-zone"
         ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
      <input type="file" id="file-input" accept=".arw,.ARW" onchange="onFileChange(event)" />
      <div class="drop-icon">🗂️</div>
      <p><b>Drag &amp; drop</b> your .ARW file(s) here</p>
      <p style="margin-top:.3rem">or <b>click to browse</b></p>
      <div class="file-list" id="file-list"></div>
    </div>

    <!-- API base URL -->
    <div class="field-group" style="margin-top:1rem">
      <label for="api-url">API Base URL</label>
      <input type="text" id="api-url" value="http://localhost:8000" placeholder="http://localhost:8000" />
    </div>

    <!-- Actions row -->
    <div class="row" style="margin-top:.75rem">
      <button class="btn" id="process-btn" onclick="processFiles()" disabled>⚡ Process</button>
      <button class="btn-outline" onclick="clearAll()">Clear</button>
      <span class="spacer"></span>
      <span style="font-size:.8rem;color:var(--muted)">
        Supported: <code style="color:var(--accent-h)">.ARW</code> (Sony RAW)
      </span>
    </div>

    <!-- Progress -->
    <div id="progress-wrap" style="display:none;margin-top:1rem">
      <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
      <div class="status-text" id="status-text">Processing…</div>
    </div>
  </div>

  <!-- ------------------------------------------------------------------- -->
  <!-- Results section                                                       -->
  <!-- ------------------------------------------------------------------- -->
  <div class="card" id="results-section">
    <div class="row" style="margin-bottom:1.25rem">
      <h2 style="margin-bottom:0">Results</h2>
      <span class="spacer"></span>
      <button class="btn-outline" onclick="clearResults()">✕ Clear results</button>
    </div>
    <div class="result-grid" id="result-grid"></div>
  </div>

</main>

<footer>RAW Agent API &mdash; powered by FastAPI + LLM Tool Calling</footer>

<!-- ===================================================================== -->
<!-- Script                                                                  -->
<!-- ===================================================================== -->
<script>
  /* -------------------------------------------------------------------- */
  /* State                                                                  */
  /* -------------------------------------------------------------------- */
  let mode = 'single';
  let selectedFiles = [];

  /* -------------------------------------------------------------------- */
  /* Health check                                                           */
  /* -------------------------------------------------------------------- */
  async function checkHealth() {
    const base = document.getElementById('api-url').value.replace(/\/$/, '');
    const dot  = document.getElementById('health-dot');
    const txt  = document.getElementById('health-text');
    try {
      // AbortSignal.timeout is available in Chrome 103+, Firefox 100+, Safari 15.4+.
      // For older browsers the health check will simply not time out.
      const signal = typeof AbortSignal.timeout === 'function'
        ? AbortSignal.timeout(3000)
        : undefined;
      const res = await fetch(`${base}/health`, signal ? { signal } : {});
      if (res.ok) {
        dot.className = 'health-dot online';
        txt.textContent = 'API online';
      } else {
        dot.className = 'health-dot offline';
        txt.textContent = 'API error';
      }
    } catch {
      dot.className = 'health-dot offline';
      txt.textContent = 'API offline';
    }
  }

  // Check on load and every 10 s
  checkHealth();
  setInterval(checkHealth, 10000);
  document.getElementById('api-url').addEventListener('change', checkHealth);

  /* -------------------------------------------------------------------- */
  /* Mode toggle                                                            */
  /* -------------------------------------------------------------------- */
  function setMode(m) {
    mode = m;
    document.getElementById('tab-single').classList.toggle('active', m === 'single');
    document.getElementById('tab-batch').classList.toggle('active',  m === 'batch');
    const fi = document.getElementById('file-input');
    fi.multiple = (m === 'batch');
    clearFiles();
  }

  /* -------------------------------------------------------------------- */
  /* File handling                                                          */
  /* -------------------------------------------------------------------- */
  function onFileChange(e) {
    addFiles(Array.from(e.target.files));
    e.target.value = '';
  }

  function onDragOver(e) {
    e.preventDefault();
    document.getElementById('drop-zone').classList.add('drag-over');
  }

  function onDragLeave() {
    document.getElementById('drop-zone').classList.remove('drag-over');
  }

  function onDrop(e) {
    e.preventDefault();
    document.getElementById('drop-zone').classList.remove('drag-over');
    addFiles(Array.from(e.dataTransfer.files));
  }

  function addFiles(files) {
    const arwFiles = files.filter(f => f.name.toLowerCase().endsWith('.arw'));
    if (mode === 'single') {
      selectedFiles = arwFiles.slice(0, 1);
    } else {
      selectedFiles = [...selectedFiles, ...arwFiles];
    }
    renderFileList();
  }

  function removeFile(idx) {
    selectedFiles.splice(idx, 1);
    renderFileList();
  }

  function renderFileList() {
    const list = document.getElementById('file-list');
    list.innerHTML = '';
    selectedFiles.forEach((f, i) => {
      const chip = document.createElement('div');
      chip.className = 'file-chip';
      chip.innerHTML = `📄 ${escHtml(f.name)} <span style="color:var(--muted);font-size:.75rem">${fmtSize(f.size)}</span><button onclick="removeFile(${i})" title="Remove">✕</button>`;
      list.appendChild(chip);
    });
    document.getElementById('process-btn').disabled = selectedFiles.length === 0;
  }

  function clearFiles() {
    selectedFiles = [];
    renderFileList();
  }

  /* -------------------------------------------------------------------- */
  /* Processing                                                             */
  /* -------------------------------------------------------------------- */
  async function processFiles() {
    if (selectedFiles.length === 0) return;

    const base    = document.getElementById('api-url').value.replace(/\/$/, '');
    const btn     = document.getElementById('process-btn');
    const wrap    = document.getElementById('progress-wrap');
    const bar     = document.getElementById('progress-bar');
    const statusT = document.getElementById('status-text');

    btn.disabled = true;
    wrap.style.display = 'block';
    bar.style.width = '5%';
    statusT.textContent = 'Uploading…';

    try {
      if (mode === 'single') {
        bar.style.width = '30%';
        statusT.textContent = `Processing ${selectedFiles[0].name}…`;
        const fd = new FormData();
        fd.append('file', selectedFiles[0]);
        const res  = await fetch(`${base}/process`, { method: 'POST', body: fd });
        bar.style.width = '80%';
        const data = await res.json();
        bar.style.width = '100%';
        statusT.textContent = res.ok ? '✅ Done!' : '❌ Error';
        showResults([data], [res.ok]);
      } else {
        const total = selectedFiles.length;
        const results = [];
        const oks     = [];
        for (let i = 0; i < total; i++) {
          statusT.textContent = `Processing ${i + 1}/${total}: ${selectedFiles[i].name}…`;
          bar.style.width = `${Math.round(((i + 0.5) / total) * 100)}%`;
          const fd = new FormData();
          fd.append('file', selectedFiles[i]);
          try {
            const res  = await fetch(`${base}/process`, { method: 'POST', body: fd });
            const data = await res.json();
            results.push(data);
            oks.push(res.ok);
          } catch (err) {
            results.push({ filename: selectedFiles[i].name, error: String(err) });
            oks.push(false);
          }
        }
        bar.style.width = '100%';
        const errCount = oks.filter(o => !o).length;
        statusT.textContent = errCount === 0
          ? `✅ All ${total} files processed!`
          : `⚠️ ${total - errCount}/${total} succeeded`;
        showResults(results, oks);
      }
    } catch (err) {
      bar.style.width = '100%';
      bar.style.background = 'var(--danger)';
      statusT.textContent = `❌ ${err.message}`;
    } finally {
      btn.disabled = false;
    }
  }

  /* -------------------------------------------------------------------- */
  /* Render results                                                         */
  /* -------------------------------------------------------------------- */
  function showResults(results, oks) {
    const section = document.getElementById('results-section');
    const grid    = document.getElementById('result-grid');
    section.style.display = 'block';

    results.forEach((r, i) => {
      const card = document.createElement('div');
      card.className = 'result-card' + (oks[i] ? '' : ' error');

      if (oks[i] && r.jpeg_b64) {
        const src = `data:image/jpeg;base64,${r.jpeg_b64}`;
        const adjRows = r.adjustments
          ? Object.entries(r.adjustments).map(([k, v]) => {
              // Adjustment values range 0–2 (1.0 = neutral); map to 0–100% bar width.
              const pct = Math.min(100, Math.round((v / 2) * 100));
              return `<tr>
                <td style="color:var(--muted);padding-right:.5rem">${escHtml(k.replace(/_/g,' '))}</td>
                <td>${v.toFixed(3)}
                  <span class="adj-bar-wrap"><span class="adj-bar" style="width:${pct}%"></span></span>
                </td></tr>`;
            }).join('')
          : '';

        card.innerHTML = `
          <div class="result-header">
            <span class="filename" title="${escHtml(r.filename)}">${escHtml(r.filename)}</span>
            <span class="status-badge ok">✓ success</span>
          </div>
          <div class="result-img-wrap">
            <img src="${src}" alt="Processed image" loading="lazy" />
          </div>
          <div class="result-body">
            <table class="adj-table">
              <thead><tr><th>Parameter</th><th>Value</th></tr></thead>
              <tbody>${adjRows}</tbody>
            </table>
            <div class="download-row">
              <a href="${src}" download="${escHtml(r.filename.replace(/\.[^.]+$/, '.jpg'))}" class="btn" style="font-size:.8rem;padding:.45rem 1rem;text-decoration:none">
                ⬇ Download JPEG
              </a>
            </div>
          </div>`;
      } else {
        const errMsg = r.error || r.detail || (r.message === 'Processing successful.' ? '' : r.message) || 'Unknown error';
        card.innerHTML = `
          <div class="result-header">
            <span class="filename" title="${escHtml(r.filename || '?')}">${escHtml(r.filename || 'Unknown file')}</span>
            <span class="status-badge err">✗ error</span>
          </div>
          <div class="error-msg">${escHtml(errMsg)}</div>`;
      }

      grid.prepend(card);
    });

    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* -------------------------------------------------------------------- */
  /* Utilities                                                              */
  /* -------------------------------------------------------------------- */
  function clearAll() {
    clearFiles();
    document.getElementById('progress-wrap').style.display = 'none';
    document.getElementById('progress-bar').style.width = '0%';
    document.getElementById('progress-bar').style.background = 'var(--accent)';
    document.getElementById('status-text').textContent = 'Processing…';
  }

  function clearResults() {
    document.getElementById('result-grid').innerHTML = '';
    document.getElementById('results-section').style.display = 'none';
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtSize(bytes) {
    if (bytes < 1024)       return `${bytes} B`;
    if (bytes < 1024*1024)  return `${(bytes/1024).toFixed(1)} KB`;
    return `${(bytes/1024/1024).toFixed(1)} MB`;
  }
</script>
</body>
</html>
